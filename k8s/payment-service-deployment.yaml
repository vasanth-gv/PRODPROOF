apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  labels:
    app: payment-service
    prodproof.io/release: v1.4.0

spec:
  replicas: 3

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service
        prodproof.io/release: v1.4.0

    spec:
      containers:
        - name: payment-service

          image: nginx:1.27-alpine

          ports:
            - containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3